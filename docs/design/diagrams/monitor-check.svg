<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="680" style="color:#171717;font-family:system-ui,-apple-system,'Segoe UI',sans-serif" viewBox="0 0 1100 680" role="img" aria-label="A monitor check first discovers new URLs, then asks of every known page whether it changed, using the cheapest method that page supports: sitemap lastmod, then conditional GET, then fetch and hash, then headless render and hash. A safety gate fails the run without publishing if too many fetches failed.">
<style>
.b { fill: #fff; stroke: currentColor; stroke-width: 1.2; }
.stop { fill: #f4f4f5; stroke: currentColor; stroke-width: 1.2; }
.key { fill: #fff; stroke: #2563eb; stroke-width: 2.4; }
.ln { fill: none; stroke: currentColor; stroke-width: 1.3; }
.t { fill: currentColor; font-size: 13px; font-weight: 600; text-anchor: middle; }
.s { fill: #71717a; font-size: 10.5px; text-anchor: middle; }
.l { fill: currentColor; font-size: 11px; }
.c { fill: #71717a; font-size: 11px; text-anchor: end; }
</style>
<rect x="0" y="0" width="1100" height="680" fill="#ffffff"/>

  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="currentColor"/>
    </marker>
  </defs>

  <text class="c" x="280" y="118" style="font-weight:600">cost per page</text>

  <!-- discover -->
  <rect class="b" x="300" y="20" width="320" height="56" rx="6"/>
  <text class="t" x="460" y="44">discover new URLs</text>
  <text class="s" x="460" y="62">sitemap diff + homepage links, every check</text>

  <line class="ln" x1="460" y1="76" x2="460" y2="130" marker-end="url(#ar)"/>
  <text class="l" x="468" y="108">then, for every known page</text>

  <!-- method chain -->
  <rect class="b" x="300" y="130" width="320" height="56" rx="6"/>
  <text class="t" x="460" y="154">1  sitemap lastmod</text>
  <text class="s" x="460" y="172">only if this site's lastmod has proved reliable</text>
  <text class="c" x="280" y="162">no request</text>

  <rect class="b" x="300" y="220" width="320" height="56" rx="6"/>
  <text class="t" x="460" y="244">2  conditional GET</text>
  <text class="s" x="460" y="262">needs a stored ETag or Last-Modified</text>
  <text class="c" x="280" y="252">1 small request</text>

  <rect class="b" x="300" y="310" width="320" height="56" rx="6"/>
  <text class="t" x="460" y="334">3  fetch, hash listing fields</text>
  <text class="s" x="460" y="352">title, description, coarse content digest</text>
  <text class="c" x="280" y="342">1 full request</text>

  <rect class="b" x="300" y="400" width="320" height="56" rx="6"/>
  <text class="t" x="460" y="424">4  headless render, then hash</text>
  <text class="s" x="460" y="442">pages that only have content after JavaScript</text>
  <text class="c" x="280" y="432">1 browser render</text>

  <line class="ln" x1="460" y1="186" x2="460" y2="220" marker-end="url(#ar)"/>
  <text class="l" x="468" y="207">no trusted lastmod</text>
  <line class="ln" x1="460" y1="276" x2="460" y2="310" marker-end="url(#ar)"/>
  <text class="l" x="468" y="297">no ETag or Last-Modified</text>
  <line class="ln" x1="460" y1="366" x2="460" y2="400" marker-end="url(#ar)"/>
  <text class="l" x="468" y="387">page needs JavaScript</text>

  <!-- unchanged exit -->
  <rect class="stop" x="800" y="130" width="260" height="326" rx="6"/>
  <text class="t" x="930" y="288">page unchanged</text>
  <text class="s" x="930" y="308">stored row is reused as is</text>

  <line class="ln" x1="620" y1="158" x2="800" y2="158" marker-end="url(#ar)"/>
  <text class="l" x="710" y="152" text-anchor="middle">same lastmod</text>
  <line class="ln" x1="620" y1="248" x2="800" y2="248" marker-end="url(#ar)"/>
  <text class="l" x="710" y="242" text-anchor="middle">304</text>
  <line class="ln" x1="620" y1="338" x2="800" y2="338" marker-end="url(#ar)"/>
  <text class="l" x="710" y="332" text-anchor="middle">same hash</text>
  <line class="ln" x1="620" y1="428" x2="800" y2="428" marker-end="url(#ar)"/>
  <text class="l" x="710" y="422" text-anchor="middle">same hash</text>

  <!-- safety gate -->
  <line class="ln" x1="460" y1="456" x2="460" y2="510" marker-end="url(#ar)"/>
  <text class="l" x="468" y="488">pages any method reported changed, plus new ones</text>

  <rect class="b" x="300" y="510" width="320" height="56" rx="6"/>
  <text class="t" x="460" y="534">safety gate</text>
  <text class="s" x="460" y="552">counts errors, blocks and bot-challenge pages</text>

  <rect class="stop" x="800" y="510" width="260" height="56" rx="6"/>
  <text class="t" x="930" y="534">run fails</text>
  <text class="s" x="930" y="552">published version stays as it was</text>
  <line class="ln" x1="620" y1="538" x2="800" y2="538" marker-end="url(#ar)"/>
  <text class="l" x="710" y="532" text-anchor="middle">too many failed fetches</text>

  <!-- publish -->
  <line class="ln" x1="460" y1="566" x2="460" y2="610" marker-end="url(#ar)"/>
  <text class="l" x="468" y="592">failures under threshold</text>

  <rect class="key" x="300" y="610" width="320" height="56" rx="6"/>
  <text class="t" x="460" y="634">regenerate and render</text>
  <text class="s" x="460" y="652">publish only where the text differs</text>
</svg>
