<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="670" style="color:#171717;font-family:system-ui,-apple-system,'Segoe UI',sans-serif" viewBox="0 0 1100 670" role="img" aria-label="Six tables. A site has many pages and many workspaces. Crawl state lives on sites and pages and is shared; each workspace has its own access token, page overrides and published llms.txt version.">
<style>
.b { fill: #fff; stroke: currentColor; stroke-width: 1.2; }
.sep { stroke: currentColor; stroke-width: 1; opacity: .35; }
.ln { fill: none; stroke: currentColor; stroke-width: 1.3; }
.ptr { fill: none; stroke: #2563eb; stroke-width: 2.2; }
.t { fill: currentColor; font-size: 14px; font-weight: 600; }
.n { fill: #71717a; font-size: 10.5px; }
.g { fill: #71717a; font-size: 10.5px; font-weight: 600; }
.f { fill: currentColor; font-size: 11px; font-family: ui-monospace, monospace; }
.l { fill: currentColor; font-size: 11px; }
.c1 { fill: #2563eb; }
.c2 { fill: #16a34a; }
.c3 { fill: #d97706; }
.c4 { fill: #9333ea; }
</style>
<rect x="0" y="0" width="1100" height="670" fill="#ffffff"/>

  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="currentColor"/>
    </marker>
    <marker id="arp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#2563eb"/>
    </marker>
  </defs>

  <!-- sites -->
  <rect class="b" x="20" y="40" width="280" height="210" rx="6"/>
  <text class="t" x="34" y="62">sites</text>
  <text class="n" x="286" y="62" text-anchor="end">shared crawl state</text>
  <line class="sep" x1="20" y1="72" x2="300" y2="72"/>
  <text class="f" x="34" y="92">id, root_url (unique)</text>
  <text class="f" x="34" y="110">site_title</text>
  <text class="f" x="34" y="128">generated_summary</text>
  <text class="f" x="34" y="146">generated_summary_source_hash</text>
  <text class="f" x="34" y="164">monitor_check_interval</text>
  <text class="f" x="34" y="182">next_monitor_check_at</text>
  <text class="f" x="34" y="200">last_monitor_check_at</text>
  <text class="f" x="34" y="218">sitemap_lastmod_is_trusted</text>
  <text class="f" x="34" y="236">discovery_fingerprints (jsonb)</text>

  <!-- site_workspaces -->
  <rect class="b" x="20" y="330" width="280" height="156" rx="6"/>
  <text class="t" x="34" y="352">site_workspaces</text>
  <text class="n" x="286" y="352" text-anchor="end">one per submission</text>
  <line class="sep" x1="20" y1="362" x2="300" y2="362"/>
  <text class="f" x="34" y="382">id, site_id</text>
  <text class="f" x="34" y="400">access_token_hash (unique)</text>
  <text class="f" x="34" y="418">public_slug (unique)</text>
  <text class="f" x="34" y="436">monitoring_enabled_until</text>
  <text class="f" x="34" y="454">published_version_id</text>
  <text class="f" x="34" y="472">creator_ip_hash</text>

  <!-- pages -->
  <rect class="b" x="380" y="40" width="360" height="458" rx="6"/>
  <text class="t" x="394" y="62">pages</text>
  <text class="n" x="726" y="62" text-anchor="end">current state per URL, shared</text>
  <line class="sep" x1="380" y1="72" x2="740" y2="72"/>

  <text class="g" x="394" y="92">identity</text>
  <text class="f" x="466" y="92">id, site_id</text>
  <text class="f" x="466" y="110">normalised_url (unique per site)</text>

  <rect class="c1" x="384" y="125" width="3" height="140"/>
  <text class="g" x="394" y="136">crawler</text>
  <text class="f" x="466" y="136">http_status_code, http_etag</text>
  <text class="f" x="466" y="154">http_last_modified, last_fetched_at</text>
  <text class="f" x="466" y="172">fetch_method, crawl_depth</text>
  <text class="f" x="466" y="190">discovered_via, inbound_link_count</text>
  <text class="f" x="466" y="208">is_in_site_navigation</text>
  <text class="f" x="466" y="226">sitemap_last_modified_at</text>
  <text class="f" x="466" y="244">consecutive_not_found_count</text>
  <text class="f" x="466" y="262">canonical_url, markdown_variant_url</text>

  <rect class="c2" x="384" y="277" width="3" height="86"/>
  <text class="g" x="394" y="288">extractor</text>
  <text class="f" x="466" y="288">extracted_title</text>
  <text class="f" x="466" y="306">extracted_description</text>
  <text class="f" x="466" y="324">page_type, language_code</text>
  <text class="f" x="466" y="342">content_markdown, content_digest</text>
  <text class="f" x="466" y="360">listing_fields_hash</text>

  <rect class="c3" x="384" y="375" width="3" height="50"/>
  <text class="g" x="394" y="386">generator</text>
  <text class="f" x="466" y="386">importance_score</text>
  <text class="f" x="466" y="404">generated_description</text>
  <text class="f" x="466" y="422">generated_description_source_digest</text>

  <text class="g" x="394" y="448">lifecycle</text>
  <text class="f" x="466" y="448">first_seen_pipeline_run_id</text>
  <text class="f" x="466" y="466">last_seen_pipeline_run_id</text>
  <text class="f" x="466" y="484">removed_at</text>

  <!-- workspace_page_overrides -->
  <rect class="b" x="380" y="540" width="360" height="84" rx="6"/>
  <rect class="c4" x="384" y="581" width="3" height="32"/>
  <text class="t" x="394" y="562">workspace_page_overrides</text>
  <text class="n" x="726" y="562" text-anchor="end">user edits</text>
  <line class="sep" x1="380" y1="572" x2="740" y2="572"/>
  <text class="f" x="394" y="592">workspace_id, page_id (primary key)</text>
  <text class="f" x="394" y="610">description_override, is_excluded</text>

  <!-- pipeline_runs -->
  <rect class="b" x="820" y="40" width="265" height="246" rx="6"/>
  <text class="t" x="834" y="62">pipeline_runs</text>
  <text class="n" x="1071" y="62" text-anchor="end">one per execution</text>
  <line class="sep" x1="820" y1="72" x2="1085" y2="72"/>
  <text class="f" x="834" y="92">id, site_id</text>
  <text class="f" x="834" y="110">requested_by_workspace_id</text>
  <text class="f" x="834" y="128">triggered_by</text>
  <text class="f" x="834" y="146">status, current_stage</text>
  <text class="f" x="834" y="164">queue_job_id, last_heartbeat_at</text>
  <text class="f" x="834" y="182">pages_discovered_count</text>
  <text class="f" x="834" y="200">pages_fetched_count</text>
  <text class="f" x="834" y="218">pages_changed_count</text>
  <text class="f" x="834" y="236">pages_failed_count</text>
  <text class="f" x="834" y="254">error_message</text>
  <text class="f" x="834" y="272">started_at, finished_at</text>

  <!-- llms_txt_versions -->
  <rect class="b" x="820" y="350" width="265" height="174" rx="6"/>
  <text class="t" x="834" y="372">llms_txt_versions</text>
  <text class="n" x="1071" y="372" text-anchor="end">append-only</text>
  <line class="sep" x1="820" y1="382" x2="1085" y2="382"/>
  <text class="f" x="834" y="402">id, workspace_id, pipeline_run_id</text>
  <text class="f" x="834" y="420">version_number</text>
  <text class="f" x="834" y="438">llms_txt_content</text>
  <text class="f" x="834" y="456">llms_txt_content_hash</text>
  <text class="f" x="834" y="474">listed_page_count</text>
  <text class="f" x="834" y="492">page_changes (jsonb)</text>
  <text class="f" x="834" y="510">created_by, created_at</text>

  <!-- relations -->
  <line class="ln" x1="300" y1="100" x2="380" y2="100" marker-end="url(#ar)"/>
  <text class="l" x="340" y="94" text-anchor="middle">has many</text>

  <line class="ln" x1="160" y1="250" x2="160" y2="330" marker-end="url(#ar)"/>
  <text class="l" x="168" y="294">has many</text>

  <line class="ln" x1="740" y1="150" x2="820" y2="150" marker-end="url(#ar)"/>
  <text class="l" x="780" y="144" text-anchor="middle">seen in</text>

  <line class="ln" x1="952" y1="286" x2="952" y2="350" marker-end="url(#ar)"/>
  <text class="l" x="960" y="322">one per workspace</text>

  <line class="ln" x1="560" y1="540" x2="560" y2="498" marker-end="url(#ar)"/>
  <text class="l" x="568" y="523">overrides a page</text>

  <polyline class="ln" points="160,486 160,582 380,582" marker-end="url(#ar)"/>
  <text class="l" x="270" y="576" text-anchor="middle">has many</text>

  <polyline class="ptr" points="100,486 100,648 952,648 952,524" marker-end="url(#arp)"/>
  <text class="l" x="526" y="642" text-anchor="middle">published_version_id: the version served for that workspace</text>
</svg>
