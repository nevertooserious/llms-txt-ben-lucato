<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="790" style="color:#171717;font-family:system-ui,-apple-system,'Segoe UI',sans-serif" viewBox="0 0 1100 790" role="img" aria-label="Six tables. A site has many pages, runs and llms.txt versions, and points at the version it serves. Users edit pages through page overrides and keep whole paths out through excluded URL prefixes. Nothing is shared between sites.">
<style>
.b { fill: #fff; stroke: currentColor; stroke-width: 1.2; }
.sep { stroke: currentColor; stroke-width: 1; opacity: .35; }
.ln { fill: none; stroke: currentColor; stroke-width: 1.3; }
.ptr { fill: none; stroke: #2563eb; stroke-width: 2.2; }
.t { fill: currentColor; font-size: 14px; font-weight: 600; }
.n { fill: #71717a; font-size: 10.5px; }
.g { fill: #71717a; font-size: 10.5px; font-weight: 600; }
.f { fill: currentColor; font-size: 11px; font-family: ui-monospace, monospace; }
.l { fill: currentColor; font-size: 11px; }
.c1 { fill: #2563eb; }
.c2 { fill: #16a34a; }
.c3 { fill: #d97706; }
.c4 { fill: #9333ea; }
</style>
<rect x="0" y="0" width="1100" height="790" fill="#ffffff"/>

  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="currentColor"/>
    </marker>
    <marker id="arp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#2563eb"/>
    </marker>
  </defs>

  <!-- sites -->
  <rect class="b" x="20" y="40" width="280" height="300" rx="6"/>
  <text class="t" x="34" y="62">sites</text>
  <text class="n" x="286" y="62" text-anchor="end">one per submission</text>
  <line class="sep" x1="20" y1="72" x2="300" y2="72"/>
  <text class="f" x="34" y="92">id, root_url</text>
  <text class="f" x="34" y="110">public_slug (unique)</text>
  <text class="f" x="34" y="128">site_title</text>
  <text class="f" x="34" y="146">generated_summary, generated_notes</text>
  <text class="f" x="34" y="164">generated_summary_source_hash</text>
  <text class="f" x="34" y="182">monitor_check_interval</text>
  <text class="f" x="34" y="200">next_monitor_check_at</text>
  <text class="f" x="34" y="218">last_monitor_check_at</text>
  <text class="f" x="34" y="236">sitemap_lastmod_is_trusted</text>
  <text class="f" x="34" y="254">requires_headless_rendering</text>
  <text class="f" x="34" y="272">headless_rendering_decided_at</text>
  <text class="f" x="34" y="290">machine_readable_resource_urls</text>
  <text class="f" x="34" y="308">published_version_id</text>
  <text class="f" x="34" y="326">is_published_version_pinned</text>

  <!-- pages -->
  <rect class="b" x="380" y="40" width="360" height="494" rx="6"/>
  <text class="t" x="394" y="62">pages</text>
  <text class="n" x="726" y="62" text-anchor="end">current state per URL</text>
  <line class="sep" x1="380" y1="72" x2="740" y2="72"/>

  <text class="g" x="394" y="92">identity</text>
  <text class="f" x="466" y="92">id, site_id</text>
  <text class="f" x="466" y="110">normalised_url (unique per site)</text>

  <rect class="c1" x="384" y="125" width="3" height="176"/>
  <text class="g" x="394" y="136">crawler</text>
  <text class="f" x="466" y="136">http_status_code, http_etag</text>
  <text class="f" x="466" y="154">http_last_modified, last_fetched_at</text>
  <text class="f" x="466" y="172">crawl_depth, first_link_position</text>
  <text class="f" x="466" y="190">discovered_via, inbound_link_count</text>
  <text class="f" x="466" y="208">is_in_site_navigation, fetch_method</text>
  <text class="f" x="466" y="226">sitemap_last_modified_at</text>
  <text class="f" x="466" y="244">outbound_link_urls</text>
  <text class="f" x="466" y="262">markdown_variant_url</text>
  <text class="f" x="466" y="280">has_noindex_directive, fetch_url</text>
  <text class="f" x="466" y="298">navigation_label, navigation_position</text>

  <rect class="c2" x="384" y="313" width="3" height="86"/>
  <text class="g" x="394" y="324">extractor</text>
  <text class="f" x="466" y="324">extracted_title, canonical_url</text>
  <text class="f" x="466" y="342">extracted_description</text>
  <text class="f" x="466" y="360">declared_site_name, page_type</text>
  <text class="f" x="466" y="378">content_markdown, content_digest</text>
  <text class="f" x="466" y="396">language_code, listing_fields_hash</text>

  <rect class="c3" x="384" y="411" width="3" height="50"/>
  <text class="g" x="394" y="422">generator</text>
  <text class="f" x="466" y="422">generated_description, listing_value</text>
  <text class="f" x="466" y="440">assessed_page_type, exclusion_reason</text>
  <text class="f" x="466" y="458">assessment_source_hash</text>

  <text class="g" x="394" y="484">lifecycle</text>
  <text class="f" x="466" y="484">first_seen_pipeline_run_id</text>
  <text class="f" x="466" y="502">last_seen_pipeline_run_id</text>
  <text class="f" x="466" y="520">removed_at</text>

  <!-- page_overrides -->
  <rect class="b" x="380" y="558" width="360" height="84" rx="6"/>
  <rect class="c4" x="384" y="599" width="3" height="32"/>
  <text class="t" x="394" y="580">page_overrides</text>
  <text class="n" x="726" y="580" text-anchor="end">user edits</text>
  <line class="sep" x1="380" y1="590" x2="740" y2="590"/>
  <text class="f" x="394" y="610">page_id (primary key), updated_at</text>
  <text class="f" x="394" y="628">description_override, is_excluded</text>

  <!-- excluded_url_prefixes -->
  <rect class="b" x="380" y="666" width="360" height="66" rx="6"/>
  <rect class="c4" x="384" y="707" width="3" height="14"/>
  <text class="t" x="394" y="688">excluded_url_prefixes</text>
  <text class="n" x="726" y="688" text-anchor="end">ignored paths</text>
  <line class="sep" x1="380" y1="698" x2="740" y2="698"/>
  <text class="f" x="394" y="718">site_id, url_prefix (primary key)</text>

  <!-- pipeline_runs -->
  <rect class="b" x="820" y="40" width="265" height="228" rx="6"/>
  <text class="t" x="834" y="62">pipeline_runs</text>
  <text class="n" x="1071" y="62" text-anchor="end">one per execution</text>
  <line class="sep" x1="820" y1="72" x2="1085" y2="72"/>
  <text class="f" x="834" y="92">id, site_id</text>
  <text class="f" x="834" y="110">triggered_by</text>
  <text class="f" x="834" y="128">status, current_stage</text>
  <text class="f" x="834" y="146">queue_job_id, last_heartbeat_at</text>
  <text class="f" x="834" y="164">pages_discovered_count</text>
  <text class="f" x="834" y="182">pages_fetched_count</text>
  <text class="f" x="834" y="200">pages_changed_count</text>
  <text class="f" x="834" y="218">pages_failed_count</text>
  <text class="f" x="834" y="236">error_message</text>
  <text class="f" x="834" y="254">started_at, finished_at</text>

  <!-- llms_txt_versions -->
  <rect class="b" x="820" y="350" width="265" height="174" rx="6"/>
  <text class="t" x="834" y="372">llms_txt_versions</text>
  <text class="n" x="1071" y="372" text-anchor="end">append-only</text>
  <line class="sep" x1="820" y1="382" x2="1085" y2="382"/>
  <text class="f" x="834" y="402">id, site_id, pipeline_run_id</text>
  <text class="f" x="834" y="420">version_number</text>
  <text class="f" x="834" y="438">llms_txt_content</text>
  <text class="f" x="834" y="456">llms_txt_content_hash</text>
  <text class="f" x="834" y="474">listed_page_count</text>
  <text class="f" x="834" y="492">page_changes (jsonb)</text>
  <text class="f" x="834" y="510">created_by, created_at</text>

  <!-- relations -->
  <line class="ln" x1="300" y1="100" x2="380" y2="100" marker-end="url(#ar)"/>
  <text class="l" x="340" y="94" text-anchor="middle">has many</text>

  <line class="ln" x1="740" y1="150" x2="820" y2="150" marker-end="url(#ar)"/>
  <text class="l" x="780" y="144" text-anchor="middle">seen in</text>

  <line class="ln" x1="952" y1="268" x2="952" y2="350" marker-end="url(#ar)"/>
  <text class="l" x="960" y="313">publishes</text>

  <line class="ln" x1="560" y1="558" x2="560" y2="534" marker-end="url(#ar)"/>
  <text class="l" x="568" y="551">overrides a page</text>

  <polyline class="ln" points="240,376 240,700 380,700" marker-end="url(#ar)"/>
  <text class="l" x="310" y="694" text-anchor="middle">has many</text>

  <polyline class="ptr" points="160,376 160,766 952,766 952,524" marker-end="url(#arp)"/>
  <text class="l" x="556" y="760" text-anchor="middle">published_version_id: the version this site serves</text>
</svg>
