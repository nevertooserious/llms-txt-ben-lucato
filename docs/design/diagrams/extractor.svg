<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="690" style="color:#171717;font-family:system-ui,-apple-system,'Segoe UI',sans-serif" viewBox="0 0 1100 690" role="img" aria-label="The extractor is a pure function from one RawPage to one PageRecord. From the HTML it reads the title, the description, the site name the page declares, the language and canonical URL, the page type, and the main content as markdown. The content gives a content digest, and the title, description and digest give the listing fields hash that the monitor uses as its change signal.">
<style>
.b { fill: #fff; stroke: currentColor; stroke-width: 1.2; }
.ext { fill: #f4f4f5; stroke: currentColor; stroke-width: 1.2; }
.key { fill: #fff; stroke: #2563eb; stroke-width: 2.4; }
.ln { fill: none; stroke: currentColor; stroke-width: 1.3; }
.t { fill: currentColor; font-size: 13px; font-weight: 600; text-anchor: middle; }
.s { fill: #71717a; font-size: 10.5px; text-anchor: middle; }
.l { fill: currentColor; font-size: 11px; }
</style>
<rect x="0" y="0" width="1100" height="690" fill="#ffffff"/>

  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="currentColor"/>
    </marker>
  </defs>

  <text class="l" x="20" y="30">A pure function: no network, files, database, clock or randomness. Tested on saved HTML fixtures.</text>

  <!-- input -->
  <rect class="ext" x="20" y="295" width="180" height="74" rx="6"/>
  <text class="t" x="110" y="321">RawPage</text>
  <text class="s" x="110" y="339">HTML, final URL,</text>
  <text class="s" x="110" y="355">response headers</text>

  <!-- fan out -->
  <polyline class="ln" points="200,332 265,332 265,88 330,88" marker-end="url(#ar)"/>
  <polyline class="ln" points="265,172 330,172" marker-end="url(#ar)"/>
  <polyline class="ln" points="265,256 330,256" marker-end="url(#ar)"/>
  <polyline class="ln" points="265,340 330,340" marker-end="url(#ar)"/>
  <polyline class="ln" points="265,424 330,424" marker-end="url(#ar)"/>
  <polyline class="ln" points="265,332 265,508 330,508" marker-end="url(#ar)"/>

  <!-- fields -->
  <rect class="b" x="330" y="60" width="400" height="56" rx="6"/>
  <text class="t" x="530" y="84">title</text>
  <text class="s" x="530" y="102">og:title, then the title tag, then the first h1</text>

  <rect class="b" x="330" y="144" width="400" height="56" rx="6"/>
  <text class="t" x="530" y="168">description</text>
  <text class="s" x="530" y="186">meta description, then og:description, then the first paragraph</text>

  <rect class="b" x="330" y="228" width="400" height="56" rx="6"/>
  <text class="t" x="530" y="252">declared site name</text>
  <text class="s" x="530" y="270">og:site_name, then a JSON-LD WebSite name, then application-name</text>

  <rect class="b" x="330" y="312" width="400" height="56" rx="6"/>
  <text class="t" x="530" y="336">language and canonical URL</text>
  <text class="s" x="530" y="354">the html lang attribute and the rel=canonical link</text>

  <rect class="b" x="330" y="396" width="400" height="56" rx="6"/>
  <text class="t" x="530" y="420">page type</text>
  <text class="s" x="530" y="438">the URL's path or subdomain decides; else og:type and JSON-LD</text>

  <rect class="b" x="330" y="480" width="400" height="56" rx="6"/>
  <text class="t" x="530" y="504">main content, as markdown</text>
  <text class="s" x="530" y="522">main, else the only article, else the element with 80% of the prose</text>

  <!-- hashes -->
  <rect class="b" x="800" y="471" width="280" height="74" rx="6"/>
  <text class="t" x="940" y="497">content_digest</text>
  <text class="s" x="940" y="515">headings and body text, without dates,</text>
  <text class="s" x="940" y="531">numbers or whitespace</text>
  <line class="ln" x1="730" y1="508" x2="800" y2="508" marker-end="url(#ar)"/>

  <rect class="b" x="800" y="93" width="280" height="74" rx="6"/>
  <text class="t" x="940" y="119">listing_fields_hash</text>
  <text class="s" x="940" y="137">title, description and content_digest:</text>
  <text class="s" x="940" y="153">what the monitor counts as a change</text>
  <polyline class="ln" points="730,88 765,88 765,130 800,130" marker-end="url(#ar)"/>
  <polyline class="ln" points="730,172 765,172 765,130"/>
  <line class="ln" x1="940" y1="471" x2="940" y2="167" marker-end="url(#ar)"/>

  <!-- output -->
  <rect class="key" x="330" y="610" width="750" height="56" rx="6"/>
  <text class="t" x="705" y="634">PageRecord</text>
  <text class="s" x="705" y="652">one per page; the worker stores it in the extractor's columns of pages</text>

  <line class="ln" x1="530" y1="536" x2="530" y2="610" marker-end="url(#ar)"/>
  <text class="l" x="538" y="578">every field</text>
  <line class="ln" x1="1010" y1="545" x2="1010" y2="610" marker-end="url(#ar)"/>
  <text class="l" x="1002" y="582" text-anchor="end">both hashes</text>
</svg>
