<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="850" style="color:#171717;font-family:system-ui,-apple-system,'Segoe UI',sans-serif" viewBox="0 0 1100 850" role="img" aria-label="The generator turns a site's stored pages into an llms.txt. Deterministic filters drop pages that cannot be listed. Claude Haiku assesses each remaining page, cached on a hash of its inputs. Selection keeps the useful pages and applies the user's kept pages and exclusions. Pages are ordered and put under H2 sections by page type. Claude Opus writes the site name, summary and notes, also cached. The file is rendered and validated against the spec, and a new version is published only where the text differs from the newest one.">
<style>
.b { fill: #fff; stroke: currentColor; stroke-width: 1.2; }
.ext { fill: #f4f4f5; stroke: currentColor; stroke-width: 1.2; }
.key { fill: #fff; stroke: #2563eb; stroke-width: 2.4; }
.ln { fill: none; stroke: currentColor; stroke-width: 1.3; }
.t { fill: currentColor; font-size: 13px; font-weight: 600; text-anchor: middle; }
.s { fill: #71717a; font-size: 10.5px; text-anchor: middle; }
.l { fill: currentColor; font-size: 11px; }
</style>
<rect x="0" y="0" width="1100" height="850" fill="#ffffff"/>

  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="currentColor"/>
    </marker>
  </defs>

  <!-- inputs -->
  <rect class="ext" x="20" y="20" width="230" height="130" rx="6"/>
  <text class="t" x="135" y="46">from the database</text>
  <text class="l" x="36" y="76">pages and their records</text>
  <text class="l" x="36" y="98">page_overrides</text>
  <text class="l" x="36" y="120">excluded_url_prefixes</text>
  <text class="l" x="36" y="142">machine-readable files found</text>
  <line class="ln" x1="250" y1="57" x2="310" y2="57" marker-end="url(#ar)"/>

  <!-- 1 filters -->
  <rect class="b" x="310" y="20" width="400" height="74" rx="6"/>
  <text class="t" x="510" y="44">1  deterministic filters</text>
  <text class="s" x="510" y="62">homepage, noindex, pagination, other languages, utility and</text>
  <text class="s" x="510" y="78">archive URLs, duplicate content, large families of sibling pages</text>

  <line class="ln" x1="710" y1="57" x2="800" y2="57" marker-end="url(#ar)"/>
  <rect class="ext" x="800" y="29" width="280" height="56" rx="6"/>
  <text class="t" x="940" y="53">not a candidate</text>
  <text class="s" x="940" y="71">never sent to the model</text>

  <line class="ln" x1="510" y1="94" x2="510" y2="128" marker-end="url(#ar)"/>
  <text class="l" x="518" y="115">candidate pages</text>

  <!-- 2 assessment -->
  <rect class="b" x="310" y="128" width="400" height="74" rx="6"/>
  <text class="t" x="510" y="152">2  page assessment</text>
  <text class="s" x="510" y="170">per page: would an assistant need it? is it broad or narrow?</text>
  <text class="s" x="510" y="186">also a one-line description and a corrected page type</text>

  <line class="ln" x1="710" y1="165" x2="800" y2="165" marker-end="url(#ar)" marker-start="url(#ar)"/>
  <rect class="ext" x="800" y="137" width="280" height="56" rx="6"/>
  <text class="t" x="940" y="161">Claude Haiku</text>
  <text class="s" x="940" y="179">asked once per hash of a page's inputs</text>

  <line class="ln" x1="510" y1="202" x2="510" y2="236" marker-end="url(#ar)"/>

  <!-- 3 selection -->
  <rect class="b" x="310" y="236" width="400" height="74" rx="6"/>
  <text class="t" x="510" y="260">3  selection</text>
  <text class="s" x="510" y="278">useful pages; a narrow page under a listed broad page is dropped;</text>
  <text class="s" x="510" y="294">the user's kept pages and exclusions; one page per canonical URL</text>

  <line class="ln" x1="710" y1="273" x2="800" y2="273" marker-end="url(#ar)"/>
  <rect class="ext" x="800" y="245" width="280" height="56" rx="6"/>
  <text class="t" x="940" y="269">left out</text>
  <text class="s" x="940" y="287">still stored, so the user can keep it</text>

  <rect class="ext" x="20" y="236" width="230" height="74" rx="6"/>
  <text class="t" x="135" y="262">a user's edit</text>
  <text class="s" x="135" y="280">renders again from the stored pages:</text>
  <text class="s" x="135" y="296">no fetch, no LLM call</text>
  <line class="ln" x1="250" y1="273" x2="310" y2="273" marker-end="url(#ar)"/>

  <line class="ln" x1="510" y1="310" x2="510" y2="344" marker-end="url(#ar)"/>
  <text class="l" x="518" y="331">listed pages</text>

  <!-- 4 order and sections -->
  <rect class="b" x="310" y="344" width="400" height="74" rx="6"/>
  <text class="t" x="510" y="368">4  order and sections</text>
  <text class="s" x="510" y="386">score: navigation, depth, inbound links, the site's own llms.txt</text>
  <text class="s" x="510" y="402">H2 by page type: Docs, API, Guides … Blog, areas, Pages, Optional</text>

  <line class="ln" x1="510" y1="418" x2="510" y2="452" marker-end="url(#ar)"/>

  <!-- 5 summary -->
  <rect class="b" x="310" y="452" width="400" height="74" rx="6"/>
  <text class="t" x="510" y="476">5  site name, summary, notes</text>
  <text class="s" x="510" y="494">from the homepage and the listed pages, in one request;</text>
  <text class="s" x="510" y="510">the previous wording is passed back and kept unless wrong</text>

  <line class="ln" x1="710" y1="489" x2="800" y2="489" marker-end="url(#ar)" marker-start="url(#ar)"/>
  <rect class="ext" x="800" y="461" width="280" height="56" rx="6"/>
  <text class="t" x="940" y="485">Claude Opus</text>
  <text class="s" x="940" y="503">asked once per hash of its inputs</text>

  <line class="ln" x1="510" y1="526" x2="510" y2="560" marker-end="url(#ar)"/>

  <!-- 6 render -->
  <rect class="b" x="310" y="560" width="400" height="56" rx="6"/>
  <text class="t" x="510" y="584">6  render</text>
  <text class="s" x="510" y="602">H1, blockquote summary, notes, H2 sections of one-line entries</text>

  <line class="ln" x1="510" y1="616" x2="510" y2="650" marker-end="url(#ar)"/>

  <!-- 7 validate -->
  <rect class="b" x="310" y="650" width="400" height="56" rx="6"/>
  <text class="t" x="510" y="674">7  validate against the spec</text>
  <text class="s" x="510" y="692">H1 and H2 only, one line per entry, an H2 named exactly Optional</text>

  <line class="ln" x1="710" y1="678" x2="800" y2="678" marker-end="url(#ar)"/>
  <text class="l" x="755" y="672" text-anchor="middle">invalid</text>
  <rect class="ext" x="800" y="650" width="280" height="56" rx="6"/>
  <text class="t" x="940" y="674">run fails</text>
  <text class="s" x="940" y="692">the published version stays as it was</text>

  <line class="ln" x1="510" y1="706" x2="510" y2="750" marker-end="url(#ar)"/>
  <text class="l" x="518" y="732">valid</text>

  <!-- 8 publish -->
  <rect class="key" x="310" y="750" width="400" height="56" rx="6"/>
  <text class="t" x="510" y="774">8  publish</text>
  <text class="s" x="510" y="792">a new version only where the text differs from the newest one</text>

  <line class="ln" x1="710" y1="778" x2="800" y2="778" marker-end="url(#ar)"/>
  <rect class="b" x="800" y="750" width="280" height="56" rx="6"/>
  <text class="t" x="940" y="774">llms_txt_versions</text>
  <text class="s" x="940" y="792">the site serves the newest, or the one pinned</text>
</svg>
