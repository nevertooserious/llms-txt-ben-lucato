<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="420" style="color:#171717;font-family:system-ui,-apple-system,'Segoe UI',sans-serif" viewBox="0 0 1100 420" role="img" aria-label="The pipeline has three stages with typed hand-offs: the crawler turns a URL into raw pages, the extractor turns raw pages into page records, and the generator turns page records into llms.txt. Each stage also persists the state the monitor later diffs against.">
<style>
.b { fill: #fff; stroke: currentColor; stroke-width: 1.2; }
.key { fill: #fff; stroke: #2563eb; stroke-width: 2.4; }
.ln { fill: none; stroke: currentColor; stroke-width: 1.3; }
.t { fill: currentColor; font-size: 14px; font-weight: 600; }
.s { fill: #71717a; font-size: 10.5px; }
.l { fill: currentColor; font-size: 11.5px; }
.a { fill: currentColor; font-size: 11.5px; font-weight: 600; font-family: ui-monospace, monospace; text-anchor: middle; }
</style>
<rect x="0" y="0" width="1100" height="420" fill="#ffffff"/>

  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="currentColor"/>
    </marker>
  </defs>

  <!-- crawler -->
  <rect class="b" x="90" y="40" width="240" height="240" rx="6"/>
  <text class="t" x="104" y="68">crawler</text>
  <text class="s" x="104" y="86">all network I/O lives here</text>
  <text class="l" x="104" y="116">1  robots.txt, sitemaps, llms.txt</text>
  <text class="l" x="104" y="138">2  seed frontier from homepage nav</text>
  <text class="l" x="104" y="160">3  priority BFS with page budget</text>
  <text class="l" x="104" y="182">4  plain GET; headless per site</text>
  <text class="l" x="104" y="204">5  per-host rate limit, SSRF guard</text>

  <!-- extractor -->
  <rect class="b" x="440" y="40" width="240" height="240" rx="6"/>
  <text class="t" x="454" y="68">extractor</text>
  <text class="s" x="454" y="86">pure function, no I/O</text>
  <text class="l" x="454" y="116">1  canonical URL, dedupe</text>
  <text class="l" x="454" y="138">2  title: og, title tag, h1</text>
  <text class="l" x="454" y="160">3  desc: meta, og, first paragraph</text>
  <text class="l" x="454" y="182">4  main content to markdown</text>
  <text class="l" x="454" y="204">5  kind: docs, api, blog, legal…</text>
  <text class="l" x="454" y="226">6  hash of listing fields</text>

  <!-- generator -->
  <rect class="b" x="790" y="40" width="240" height="240" rx="6"/>
  <text class="t" x="804" y="68">generator</text>
  <text class="s" x="804" y="86">LLM optional, heuristic fallback</text>
  <text class="l" x="804" y="116">1  score pages: nav, depth, inlinks</text>
  <text class="l" x="804" y="138">2  H2 sections from page type</text>
  <text class="l" x="804" y="160">3  LLM: summary, missing descs</text>
  <text class="l" x="804" y="182">4  low scores go under Optional</text>
  <text class="l" x="804" y="204">5  render, validate against spec</text>

  <!-- hand-offs -->
  <line class="ln" x1="20" y1="160" x2="90" y2="160" marker-end="url(#ar)"/>
  <text class="a" x="52" y="152">URL</text>

  <line class="ln" x1="330" y1="160" x2="440" y2="160" marker-end="url(#ar)"/>
  <text class="a" x="385" y="152">RawPage</text>
  <text class="s" x="385" y="178" text-anchor="middle">one at a time</text>

  <line class="ln" x1="680" y1="160" x2="790" y2="160" marker-end="url(#ar)"/>
  <text class="a" x="735" y="152">PageRecord[]</text>
  <text class="s" x="735" y="178" text-anchor="middle">title, desc, kind</text>

  <line class="ln" x1="1030" y1="160" x2="1090" y2="160" marker-end="url(#ar)"/>
  <text class="a" x="1062" y="152">llms.txt</text>

  <!-- persistence -->
  <rect class="key" x="90" y="350" width="940" height="50" rx="6"/>
  <text class="t" x="560" y="380" text-anchor="middle">Postgres: what the monitor diffs against next time</text>

  <line class="ln" x1="210" y1="280" x2="210" y2="350" marker-end="url(#ar)"/>
  <text class="l" x="218" y="320">etag, last-modified</text>
  <line class="ln" x1="560" y1="280" x2="560" y2="350" marker-end="url(#ar)"/>
  <text class="l" x="568" y="320">record + listing hash</text>
  <line class="ln" x1="910" y1="280" x2="910" y2="350" marker-end="url(#ar)"/>
  <text class="l" x="918" y="320">version, if text differs</text>
</svg>
