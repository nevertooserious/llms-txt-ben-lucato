# Local stack: docker compose up --build, then open http://localhost:3000.
# Values come from .env if it exists; none are required. Ports bind to loopback only
# because the database password is a local default.

x-app: &app
  build: .
  init: true
  restart: unless-stopped
  depends_on:
    postgres:
      condition: service_healthy

x-app-environment: &app-environment
  # Set here so a DATABASE_URL in .env pointing at localhost does not reach the containers.
  DATABASE_URL: postgres://postgres:postgres@postgres:5432/llms_txt
  LOG_LEVEL: ${LOG_LEVEL:-}

services:
  postgres:
    image: postgres:14
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: llms_txt
    ports:
      # Not 5432, so it does not clash with a Postgres already on the host.
      - "127.0.0.1:${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      # Applied only when the data volume is empty, in file name order.
      - ./db/schema.sql:/docker-entrypoint-initdb.d/10-schema.sql:ro
      - ./db/demo-seed.sql:/docker-entrypoint-initdb.d/20-demo-seed.sql:ro
    healthcheck:
      # Over TCP: during init the temporary server listens only on its Unix socket, so
      # this stays unhealthy until the schema has been applied.
      test: ["CMD", "pg_isready", "--host=127.0.0.1", "--username=postgres", "--dbname=llms_txt"]
      interval: 2s
      timeout: 3s
      retries: 30

  web:
    <<: *app
    working_dir: /app/apps/web
    command: ["../../node_modules/.bin/next", "start", "--hostname", "0.0.0.0", "--port", "3000"]
    environment:
      <<: *app-environment
      BASIC_AUTH_USERNAME: ${BASIC_AUTH_USERNAME:-}
      CRAWL_PAGE_BUDGET: ${CRAWL_PAGE_BUDGET:-}
      BASIC_AUTH_PASSWORD: ${BASIC_AUTH_PASSWORD:-}
      # Links the home page to the workspace from db/demo-seed.sql.
      DEMO_SITE_ENABLED: "true"
    ports:
      - "127.0.0.1:${WEB_PORT:-3000}:3000"

  worker:
    <<: *app
    working_dir: /app/apps/worker
    command: ["../../node_modules/.bin/tsx", "src/main.ts"]
    environment:
      <<: *app-environment
      PIPELINE_RUN_CONCURRENCY: ${PIPELINE_RUN_CONCURRENCY:-}
      CRAWL_PAGE_BUDGET: ${CRAWL_PAGE_BUDGET:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      LLM_CLIENT: ${LLM_CLIENT:-}
    # Chromium uses shared memory; Docker's default of 64 MB is too small.
    shm_size: 1gb

volumes:
  postgres-data:
