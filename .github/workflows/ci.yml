name: CI

on:
  push:
    branches: [main]
  pull_request:
    # edited: re-run pr-description when the description changes.
    types: [opened, synchronize, reopened, edited]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install xmllint
        run: sudo apt-get update && sudo apt-get install --yes --no-install-recommends libxml2-utils
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: scripts/lint.sh
      - run: scripts/test.sh

  e2e:
    runs-on: ubuntu-latest
    # Pinned to the playwright version in package-lock.json; scripts/lint.sh checks the two match.
    container:
      image: mcr.microsoft.com/playwright:v1.65.1-noble
    # The pipeline and monitor tests run the queue and the worker against Postgres. Inside
    # a container job the service is reached by its name, not localhost.
    services:
      postgres:
        image: postgres:14
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: e2e
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/e2e
    steps:
      - uses: actions/checkout@v4
      - name: Install psql
        run: apt-get update && apt-get install --yes --no-install-recommends postgresql-client
      - run: scripts/validate-schema.sh
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: scripts/test-e2e.sh

  pr-description:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: scripts/check_pr_description.py
        env:
          PR_BODY: ${{ github.event.pull_request.body }}

  schema:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:14
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: schema_check
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - run: scripts/validate-schema.sh
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/schema_check
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run test:database
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/schema_check
